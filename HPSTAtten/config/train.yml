epochs: 200
batch_size: 32
learning_rate: 1.0e-6
weight_decay: 0.06
emb_dim: 256
depth: 2
num_heads: 8
T: 16
chunk_size: 2
num_workers: 0
pooling_stat: "0011"
spike_mode: lif
lif_backend: auto
hybrid_qkv: "true"
attention_mode: factorized
dvs_augment: "true"
dvs_random_split: "false"
augment_train: "true"
rand_augment: "true"
random_erasing: 0.25
mixup: 0.5
label_smoothing: 0.1
scheduler: "none"
warmup_epochs: 20
min_lr: 1.0e-7
dataset: cifar10-dvs
# Chemins portables : relatifs au dossier du projet HPSTAtten (résolus au runtime).
# Un chemin absolu (ex: passé par le Makefile) reste prioritaire.
data_dir: ../data
save_dir: save
device: cuda
