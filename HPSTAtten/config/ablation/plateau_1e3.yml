# Ablation LR — ReduceLROnPlateau threshold=1e-3 (tuteur)
# make ablation-lr-plateau-1e3 DATASET=cifar10

epochs: 30
batch_size: 32
learning_rate: 3.0e-4
weight_decay: 5.0e-4
emb_dim: 256
depth: 2
num_heads: 8
T: 4
chunk_size: 2
num_workers: 0
pooling_stat: "0011"
spike_mode: lif
lif_backend: auto
hybrid_qkv: "true"
attention_mode: factorized
membrane_block: "false"
tet_loss: "false"
tet_lamb: 0.0
tet_means: 1.0
dvs_augment: "false"
dvs_random_split: "false"
augment_train: "true"
rand_augment: "false"
random_erasing: 0.0
mixup: 0.0
label_smoothing: 0.1
scheduler: plateau
warmup_epochs: 0
min_lr: 1.0e-6
scheduler_step_size: 10
scheduler_gamma: 0.5
scheduler_patience: 4
scheduler_factor: 0.5
scheduler_threshold: 0.001
dataset: cifar10
data_dir: ../data
save_dir: save
device: cuda
