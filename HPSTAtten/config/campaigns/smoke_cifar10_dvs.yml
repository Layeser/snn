# Smoke test orchestrateur — CIFAR-10-DVS, petit sous-ensemble, T court
epochs: 2
batch_size: 4
learning_rate: 5.0e-4
weight_decay: 0.06
emb_dim: 128
depth: 2
num_heads: 4
T: 4
chunk_size: 2
num_workers: 0
pooling_stat: "0011"
spike_mode: lif
lif_backend: auto
hybrid_qkv: "true"
attention_mode: factorized
membrane_block: "false"
tet_loss: "false"
tet_lamb: 0.0
tet_means: 1.0
dvs_augment: "false"
dvs_random_split: "false"
augment_train: "false"
rand_augment: "false"
random_erasing: 0.0
mixup: 0.0
label_smoothing: 0.0
scheduler: none
warmup_epochs: 0
min_lr: 1.0e-5
scheduler_step_size: 30
scheduler_gamma: 0.5
scheduler_patience: 4
scheduler_factor: 0.5
scheduler_threshold: 0.001
dataset: cifar10-dvs
data_dir: ../data
save_dir: save
device: cuda
