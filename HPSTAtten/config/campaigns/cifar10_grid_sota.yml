# Grille 4×2 CIFAR-10 — HP Optuna t27 + recette SOTA complète (STAtten / Spikformer).
# Remplace train_cifar10.yml (LR=5e-4, WD=0.06, aug off) pour make grid-* sur cifar10.
#
# HP optimisation (trial #27, hpstattn-cifar10) :
#   lr, wd, mixup, label_smoothing
# Compléments manquants vs papier / STAtten CIFAR :
#   rand_augment, random_erasing, batch 64, warmup 20
#
# embed 512 : make grid-statten DATASET=cifar10 EMBED_DIM=512
# Push final 96 %+ : EPOCHS=310 EXTRA_ARGS="--epochs 310"

epochs: 200
batch_size: 64
learning_rate: 0.001298944498363822
weight_decay: 0.0001439342978124614
emb_dim: 256
depth: 2
num_heads: 8
T: 4
chunk_size: 2
num_workers: 0
pooling_stat: "0011"
spike_mode: lif
lif_backend: auto
hybrid_qkv: "true"
attention_mode: factorized
window_size: 0
window_shift: "false"
mix_rank: 0
num_landmarks: 0
hgr_lambda: 0.1
hgr_diag_gate: "true"
hgr_trace_gate: "true"
mk_dual_scale: "true"
membrane_block: "false"
tet_loss: "false"
tet_lamb: 0.0
tet_means: 1.0
dvs_augment: "false"
dvs_random_split: "false"
augment_train: "true"
rand_augment: "true"
random_erasing: 0.25
mixup: 0.2
label_smoothing: 0.15
scheduler: cosine
warmup_epochs: 20
min_lr: 1.0e-5
scheduler_step_size: 30
scheduler_gamma: 0.5
scheduler_patience: 4
scheduler_factor: 0.5
scheduler_threshold: 0.001
dataset: cifar10
data_dir: ../data
save_dir: save
device: cuda
