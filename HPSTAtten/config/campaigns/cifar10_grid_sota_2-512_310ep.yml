# CIFAR-10 grille : depth=2, embed=512, 310 epochs (push SOTA ~96 %+).
# Usage : make grid-fresh-hp DATASET=cifar10 GRID_CAMPAIGN=2-512-310

epochs: 310
batch_size: 64
learning_rate: 0.001298944498363822
weight_decay: 0.0001439342978124614
emb_dim: 512
depth: 2
num_heads: 8
T: 4
chunk_size: 2
num_workers: 0
pooling_stat: "0011"
spike_mode: lif
lif_backend: auto
hybrid_qkv: "true"
attention_mode: factorized
window_size: 0
window_shift: "false"
mix_rank: 0
num_landmarks: 0
hgr_lambda: 0.1
hgr_diag_gate: "true"
hgr_trace_gate: "true"
mk_dual_scale: "true"
membrane_block: "false"
tet_loss: "false"
tet_lamb: 0.0
tet_means: 1.0
dvs_augment: "false"
dvs_random_split: "false"
augment_train: "true"
rand_augment: "true"
random_erasing: 0.25
mixup: 0.2
label_smoothing: 0.15
scheduler: cosine
warmup_epochs: 20
min_lr: 1.0e-5
scheduler_step_size: 30
scheduler_gamma: 0.5
scheduler_patience: 4
scheduler_factor: 0.5
scheduler_threshold: 0.001
dataset: cifar10
data_dir: ../data
save_dir: save
device: cuda
